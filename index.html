<style>
:root{
  --paper:#F4F5F8; --card:#FFFFFF; --ink:#1C335C; --on-ink:#FFFFFF; --ink-soft:#E3E8F2; --gold:#C29A3E; --gold-soft:#F6EED9;
  --note-soft:#F1ECF7; --note-line:#B9A6D6;
  --gold-ink:#8A6416; --paper-card:#FFFFFF; --soft-line:#E6E1F2;
  --rose:#C42A52; --rose-soft:#FBE4EA; --ok:#0E7A53; --ok-soft:#DCF2E8;
  --text:#1A2030; --muted:#566079; --line:#D5DCEB;
  --r-s:6px; --r-m:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10162A; --card:#18203A; --ink:#B5C7F2; --on-ink:#0F1328; --ink-soft:#24305A; --gold:#E2C075; --gold-soft:#3A3220;
  --note-soft:#29233C; --note-line:#6E5C96;
  --gold-ink:#E9C77B; --paper-card:#161D36; --soft-line:#323A63;
    --rose:#FF7C9C; --rose-soft:#3B1F2E; --ok:#56D3A4; --ok-soft:#163A2F;
    --text:#E7EAF4; --muted:#A1A9C3; --line:#2D3558;
  }
}
:root[data-theme="dark"]{
  --paper:#10162A; --card:#18203A; --ink:#B5C7F2; --on-ink:#0F1328; --ink-soft:#24305A; --gold:#E2C075; --gold-soft:#3A3220;
  --note-soft:#29233C; --note-line:#6E5C96;
  --gold-ink:#E9C77B; --paper-card:#161D36; --soft-line:#323A63;
  --rose:#FF7C9C; --rose-soft:#3B1F2E; --ok:#56D3A4; --ok-soft:#163A2F;
  --text:#E7EAF4; --muted:#A1A9C3; --line:#2D3558;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--text);
  font-family:"Mukta","Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--ink)}
img{max-width:100%}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:4px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}

/* header */
.top{background:var(--card);border-bottom:3px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 4px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px;flex:none}
.wordmark{font-family:"Oswald","Arial Narrow","Roboto Condensed",sans-serif;font-weight:600;font-size:21px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.hero-brand{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.hero-brand img{width:84px;height:84px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 2px var(--gold)}
.hero-brand .wordmark{font-size:30px;color:var(--ink)}
.subh{font-size:19px;font-weight:700;color:var(--ink);margin:-4px 0 10px}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;font-weight:600;padding:4px 12px;cursor:pointer;min-height:34px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
nav.main{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:6px 10px;border-radius:999px}
nav.main a.on{color:var(--ink);background:var(--ink-soft)}

main{padding:22px 0 40px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(28px,6vw,42px);font-weight:800}
h2{font-size:23px;font-weight:800;margin-top:1.6em}
h3{font-size:18px;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.crumbs{font-size:14.5px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}

/* hero */
.hero{padding:10px 0 6px}
.hero h1{max-width:18ch}
.hero .lead{font-size:19px;color:var(--muted);max-width:52ch}
.sheet{display:flex;align-items:center;gap:10px;margin:22px 0;font-weight:600;color:var(--muted);font-size:15px}
.sheet .b{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;color:var(--ink);font-size:14px}
.sheet .b.f{background:var(--gold);border-color:var(--gold);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .sheet .b.f{animation:fill .5s .4s both}
  @keyframes fill{from{background:transparent;color:var(--ink)}to{background:var(--gold);color:#fff}}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:var(--r-s);
  background:var(--ink);color:var(--on-ink);border:2px solid var(--ink);font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}

/* steps */
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--card)}
.steps li{padding:12px 14px;box-shadow:0 0 0 .5px var(--line)}
.steps b{display:block;color:var(--ink)}
.steps span{font-size:14.5px;color:var(--muted)}

/* lists of subjects / topics */
.list{list-style:none;padding:0;margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.list a.item{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:var(--text)}
.list a.item:hover{background:var(--ink-soft)}
.item .name{flex:1;font-weight:600}
.item .meta{font-size:14px;color:var(--muted);white-space:nowrap;text-align:right}
.bar{display:block;height:5px;width:70px;border-radius:3px;background:var(--line);margin-top:4px;margin-left:auto;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.group-note{font-size:15px;color:var(--muted);margin:-.3em 0 .8em}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin:14px 0 18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;padding:9px 13px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--ink);border-color:var(--gold)}

/* boxes */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:18px}
.box+.box{margin-top:14px}
.note{border-left:4px solid var(--rose);background:var(--rose-soft);padding:12px 14px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:15.5px;margin:14px 0}
.note.info{border-color:var(--ink);background:var(--ink-soft)}
.empty{text-align:center;padding:30px 18px}
.empty p{margin:0 auto 1em}
.notes h3{margin-top:1.2em;color:var(--ink)}
.notes h3:first-child{margin-top:0}
.notes ul{padding-left:1.2em;margin:0 0 1em}
.notes li{margin:.25em 0}

/* question */
.qmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-bottom:10px}
.qmeta .count{font-weight:700;color:var(--text);margin-right:auto}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:13px;color:var(--muted)}
.chip.pyq{border-color:var(--rose);color:var(--rose);font-weight:600}
.loadbox{text-align:center;padding:34px 18px}.spin{width:42px;height:42px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--c1s);border-top-color:var(--c1);animation:gspin .9s linear infinite}@keyframes gspin{to{transform:rotate(360deg)}}
.privlist{margin:0;padding-left:1.2em;line-height:1.7}.privlist li{margin:.35em 0}
.qtext{font-size:18.5px;font-weight:600;white-space:pre-line;margin-bottom:16px}
.ditab{display:table;border-collapse:collapse;margin:8px 0 10px;font-size:.92em;font-weight:500}.ditab .dr{display:table-row}.ditab .dr>span{display:table-cell;border:1px solid var(--line,#d9d4ef);padding:5px 14px;text-align:center}.ditab .dh>span{background:var(--c1s,#eef0ff);font-weight:700}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:52px;padding:8px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-s);font:inherit;color:var(--text);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.bub{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink);transition:background .15s}
.opt.sel .bub{background:var(--ink);color:var(--on-ink)}
.opt.sel{border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--rose);background:var(--rose-soft)}
.opt.bad .bub{background:var(--rose);border-color:var(--rose);color:#fff}
.exp{margin-top:14px;padding:12px 14px;border-radius:var(--r-s);background:var(--ink-soft)}
.exp strong{display:block}
.exp.good strong{color:var(--ok)} .exp.miss strong{color:var(--rose)}
.exp p{margin:.3em 0 0;white-space:pre-line}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.timer{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--rose)}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.palette button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.palette button.done{border-color:var(--ink);background:var(--ink-soft)}
.palette button.cur{border-color:var(--rose);border-width:2.5px}
.score{font-size:46px;font-weight:800;color:var(--ink);line-height:1}
.stats{display:flex;flex-wrap:wrap;gap:18px;margin:12px 0 18px;font-size:15.5px}
.stats b{font-size:20px;display:block}
.review{margin-top:18px}
.review .box{padding:14px}
.rev-a{font-size:15.5px;margin-top:6px}
.rev-a .c{color:var(--ok);font-weight:700}
.rev-a .w{color:var(--rose);font-weight:700}
details.rv summary{cursor:pointer;color:var(--ink);font-weight:600;margin-top:8px}

/* forms */
label.ck{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:600}
label.ck input{width:20px;height:20px;accent-color:var(--ink)}
select{font:inherit;padding:8px 10px;border-radius:var(--r-s);border:1.5px solid var(--line);background:var(--card);color:var(--text);min-height:44px}

/* exam detail */
.facts{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;margin:0}
.facts dt{font-weight:700;color:var(--muted);font-size:15px}
.facts dd{margin:0}
@media (max-width:560px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:12px}}
.pending{color:var(--rose);font-weight:600}

/* bank */
details.bank{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:10px}
details.bank summary{padding:14px 16px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px}
.tbl-wrap{overflow-x:auto;padding:0 16px 14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}

.trow{padding:14px 16px}
.trow .th{display:flex;gap:12px;align-items:baseline;justify-content:space-between}
.trow .tname{font-weight:600;color:var(--text);text-decoration:none}
.trow .tname:hover{text-decoration:underline}
.trow .meta{white-space:nowrap;font-size:14px;color:var(--muted);text-align:right}
.qb{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.qb a{display:inline-flex;align-items:center;min-height:36px;padding:3px 11px;border:1.5px solid var(--ink);border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink)}
.qb a.p{background:var(--ink);color:var(--on-ink)}
.soon{font-size:14px;color:var(--muted);margin-top:6px}
.report{display:inline-block;margin-top:8px;font-size:14.5px;color:var(--muted)}
.fld{display:block;font-weight:600;margin:14px 0 5px}
.inp{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--card);color:var(--text)}
textarea.inp{min-height:120px;resize:vertical}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate label{position:relative}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate span{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;color:var(--ink);cursor:pointer}
.rate input:checked+span{background:var(--ink);color:var(--on-ink)}
.rate input:focus-visible+span{outline:3px solid var(--rose);outline-offset:2px}
.hp{position:absolute;left:-9999px}
.qfig{margin:-4px 0 16px;color:var(--text)}
.qfig svg{display:block;width:100%;max-width:280px;height:auto}
.qfig svg[viewBox^="0 0 548"]{max-width:440px}
.ofig{display:block;width:96px;color:var(--text)}
.ofig svg{display:block;width:100%;height:auto}
.rev-fig{width:70px;display:inline-block;vertical-align:middle;color:var(--ok)}
.rev-fig svg{width:100%;height:auto;display:block}

.hb-text{display:flex;flex-direction:column;gap:4px}
.tagline{font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--gold);text-transform:uppercase}
.bless{margin:26px 0 6px;padding:20px 18px;border-radius:var(--r-m);background:var(--gold-soft);border:1px solid var(--gold);text-align:center}
.bless-q{margin:0 auto 6px;font-weight:800;font-size:19px}
.bless-s{margin:0 auto 14px;font-size:15.5px;color:var(--muted);max-width:44ch}
.thought{margin:14px 0 4px;padding:10px 14px;border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:0 var(--r-s) var(--r-s) 0;font-size:15.5px}
.bless-btn{font:inherit;font-weight:800;font-size:18px;min-height:52px;padding:10px 26px;border-radius:999px;border:0;background:var(--gold);color:#fff;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.bless-btn:disabled{background:var(--ok);cursor:default}
.bless-k{margin:4px auto 4px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.bless-t{margin:0 auto 16px;font-size:17px;font-style:italic;max-width:46ch;line-height:1.5}
.bless-n{margin:10px auto 0;font-size:15px;color:var(--muted);min-height:1.2em}
.gratitude{border-left:4px solid var(--gold);padding:4px 0 4px 16px}
.gratitude p{font-size:17.5px}

.sets{margin:0 0 16px}
.sets-h{margin:0 0 8px;font-weight:700;font-size:15px;color:var(--muted)}
.setbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.setbtn{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--card);text-decoration:none;color:var(--text);font-size:14px}
.setbtn b{font-size:16px;color:var(--ink)}
.setbtn.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft)}
.setbtn .best{color:var(--ok);font-weight:700;font-size:13px}

.bm{margin-left:4px;border:0;background:none;font-size:22px;line-height:1;color:var(--gold);cursor:pointer;padding:2px 4px;min-width:36px;min-height:36px}
.daily{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:16px;padding:14px 16px;border-radius:var(--r-m);background:var(--ink);color:var(--on-ink);text-decoration:none}
.daily-t{font-weight:800;font-size:17px;flex:1 1 100%}
.daily-s{font-size:15px;opacity:.9}
.daily-f{font-weight:800;color:var(--gold)}
.streak{font-weight:800;color:var(--gold);font-size:18px}
.mecards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 4px}
.mecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px}
.mecard b{display:block;font-size:24px;color:var(--ink)}
.mecard span{font-size:14px;color:var(--muted)}
.reslinks{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.reslink{display:inline-flex;align-items:center;min-height:42px;padding:6px 14px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:700;font-size:15px}

.nextstep{margin-top:18px;padding:16px;border-radius:var(--r-m);background:var(--gold-soft);border:1px solid var(--gold)}
.ns-t{margin:0 0 10px;font-weight:800;font-size:17px}
.readfirst{display:block;margin:0 0 14px;padding:10px 14px;border-radius:var(--r-s);background:var(--ink-soft);color:var(--ink);font-weight:700;text-decoration:none;font-size:15px}
footer{border-top:3px solid var(--gold);padding:22px 0 30px;color:var(--muted);font-size:14px}
footer p{max-width:none}
.link-btn{background:none;border:0;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer}
.hi2{display:block;color:var(--ink);font-size:.92em;margin-top:2px}
.personal-card{background:var(--gold-soft);border:2px solid var(--gold);border-radius:var(--r-m);padding:18px 20px;margin:14px 0 22px}
.personal-card .pen{margin:0 0 10px;font-size:17.5px;line-height:1.6;font-style:italic;font-weight:600;color:var(--text)}
.personal-card .phi{margin:0 0 10px;font-size:17px;line-height:1.7;font-weight:600;color:var(--text)}
.personal-card .sign{margin:0;text-align:right;font-weight:700;color:var(--gold-ink,var(--ink));font-size:15px}

/* ---------- storage (safe) ---------- */

function T(en,hi){return (S.lang==='hi'&&hi)?hi:en}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- data ---------- */
var SUBJ=(window.SYLLABUS&&window.SYLLABUS.subjects)||[];
var EXAMS=window.EXAMS||[];
var NOTES=window.NOTES||{};
var LET='ABCDEF';
var BAD=[];
function ansIdx(q){return LET.indexOf(String(q.answer||'').trim().toUpperCase())}
function valid(q){
  return q&&q.id&&q.subject&&q.topic&&q.q_en&&Array.isArray(q.options_en)&&q.options_en.length>=2&&ansIdx(q)>=0&&ansIdx(q)<q.options_en.length;
}
function isPub(q){return String(q.status||'published').toLowerCase()==='published'}
function prep(list,isCA){
  var out=[],seen={};
  (list||[]).forEach(function(q){
    if(isCA&&q){q=Object.assign({},q,{subject:'ca',topic:q.category})}
    if(!valid(q)){BAD.push(q&&q.id?q.id:'(question without id)');return}
    if(seen[q.id]){BAD.push(q.id+' (repeated id)');return}
    seen[q.id]=1;
    if(isPub(q))out.push(q);
  });
  return out;
}
var QS=prep(window.QUESTIONS,false);
var CAQ=prep(window.CA_QUESTIONS,true);
var HAS_CA=CAQ.length>0;
if(!HAS_CA)SUBJ=SUBJ.filter(function(x){return x.id!=='ca'});
var ALL=QS.concat(CAQ);
/* questions load in the background so the first screen appears quickly */
var READY=QS.length>0,WAITING=false,BANK_FAIL=false;
function needsData(f,p){return !(f===''||f==='about'||f==='privacy'||f==='resources'||f==='exams'||f==='papers'||(f==='feedback'&&!p[1]))}
function loaderHTML(){return '<div class="box loadbox"><div class="spin" aria-hidden="true"></div><p><b>'+(BANK_FAIL?T('Questions could not be loaded.','प्रश्न लोड नहीं हो सके।'):T('Loading questions…','प्रश्न लोड हो रहे हैं…'))+'</b></p><p class="small muted">'+(BANK_FAIL?T('Please check your internet connection and try again.','कृपया इंटरनेट कनेक्शन जाँचें और फिर से कोशिश करें।')+'</p><p><button class="btn" type="button" onclick="location.reload()">'+T('Try again','फिर से कोशिश करें')+'</button>':T('The first visit can take a few seconds. After that the website opens quickly, even offline.','पहली बार में कुछ सेकंड लग सकते हैं। उसके बाद वेबसाइट जल्दी खुलती है, बिना इंटरनेट के भी।'))+'</p></div>'}

  QS=prep(window.QUESTIONS,false);ALL=QS.concat(CAQ);READY=true;

function subj(id){for(var i=0;i<SUBJ.length;i++)if(SUBJ[i].id===id)return SUBJ[i];return null}

function qHTML(q){var L=esc(qText(q)).split('\n'),o=[],t=[];function fl(){if(t.length){o.push('<span class="ditab">'+t.map(function(r,i){return '<span class="dr'+(i?'':' dh')+'">'+r.split(' | ').map(function(c){return '<span>'+c+'</span>'}).join('')+'</span>'}).join('')+'</span>');t=[]}}
L.forEach(function(l){if(l.indexOf(' | ')>0)t.push(l);else{fl();o.push(l)}});fl();return o.join('\n').replace(/\n?(<span class="ditab">)/g,'\n$1').replace(/(<\/span><\/span>)\n/g,'$1')}
function qOpts(q){return (S.lang==='hi'&&Array.isArray(q.options_hi)&&q.options_hi.length===q.options_en.length&&q.options_hi.every(Boolean))?q.options_hi:q.options_en}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- progress ---------- */
function stats(){return load('stats',{})}
function record(q,chosen){
  var s=stats(),k=q.subject+'/'+q.topic,o=s[k]||{a:0,c:0},ok=chosen===ansIdx(q);
  o.a++; if(ok)o.c++; s[k]=o; save('stats',s);
  var m=load('mist',[]),i=m.indexOf(q.id);
  if(ok&&i>=0)m.splice(i,1); if(!ok&&i<0)m.push(q.id);
  save('mist',m);
}
function prog(sid,tid){
  var s=stats(),a=0,c=0;
  Object.keys(s).forEach(function(k){var p=k.split('/');if(p[0]===sid&&(!tid||p[1]===tid)){a+=s[k].a;c+=s[k].c}});
  return {a:a,c:c,pct:a?Math.round(c*100/a):0};
}
function progMeta(n,p){
  var t=READY?n+' '+T(n===1?'question':'questions',n===1?'प्रश्न':'प्रश्न'):T('Loading questions…','प्रश्न लोड हो रहे हैं…');
  if(p.a) t+='<span class="bar" title="'+p.pct+'%"><i style="width:'+p.pct+'%"></i></span>';
  return t;
}

  return '<div class="box empty"><h3>'+h+'</h3><p class="muted">'+p+'</p>'+(href?'<a class="btn ghost" href="'+href+'">'+btn+'</a>':'')+'</div>';

function md(src){
  var out=[],inList=false,para=[];
  function flushP(){if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[]}}
  function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
  String(src||'').split(/\r?\n/).forEach(function(line){
    var l=line.trim();
    if(/^- /.test(l)){flushP();if(!inList){out.push('<ul>');inList=true}out.push('<li>'+inline(l.slice(2))+'</li>');return}
    if(inList){out.push('</ul>');inList=false}
    if(/^# /.test(l)){flushP();out.push('<h3>'+inline(l.slice(2))+'</h3>');return}
    if(!l){flushP();return}
    para.push(inline(l));
  });
  flushP(); if(inList)out.push('</ul>');
  return out.join('');
}

/* ---------- question runner ---------- */
function chips(q,showSource){
  var c=[];
  if(q.difficulty){var dh={easy:'आसान',medium:'मध्यम',hard:'कठिन'}[String(q.difficulty).toLowerCase()];c.push('<span class="chip">'+esc(T(q.difficulty,dh))+'</span>')}
  if(isPYQ(q))c.push('<span class="chip pyq">PYQ '+esc(q.year)+'</span>');
  else if(isStyle(q))c.push('<span class="chip pyq">'+T('Previous-year style','पिछले वर्षों की शैली')+'</span>');
  if(q.month)c.push('<span class="chip">'+esc(monthName(q.month))+'</span>');
  var h=c.join('');
  if(showSource&&isPYQ(q))h+='<span class="chip">'+esc(q.source)+'</span>';
  return h;
}
function noQuestions(){
  return emptyBox(T('No questions here yet','अभी यहाँ कोई प्रश्न नहीं'),T('This question slot is ready. New questions will appear here as soon as they are added.','यह प्रश्न स्थान तैयार है। नए प्रश्न जोड़े जाते ही यहाँ दिखाई देंगे।'),'#/subjects',T('Explore other topics','अन्य टॉपिक देखें'));
}
function runner(el,list,mode){
  if(!list.length){el.innerHTML=noQuestions();return}
  var st={i:0,ans:list.map(function(){return -1})};
  function draw(){
    var q=list[st.i],a=st.ans[st.i],ci=ansIdx(q),o=qOpts(q),last=st.i===list.length-1,e=qExp(q);
    el.innerHTML='<div class="box">'+
      '<div class="qmeta"><span class="count">'+T('Question','प्रश्न')+' '+(st.i+1)+' / '+list.length+'</span>'+chips(q,mode==='pyq')+bmBtn(q)+'</div>'+
      '<p class="qtext">'+qHTML(q)+'</p>'+qFig(q)+
      '<div class="opts">'+o.map(function(x,k){
        var c='opt';if(a>=0){if(k===ci)c+=' ok';else if(k===a)c+=' bad'}
        return '<button type="button" class="'+c+'" data-k="'+k+'"'+(a>=0?' disabled':'')+'><span class="bub">'+LET[k]+'</span>'+(oFig(q,k)||'<span>'+esc(x)+'</span>')+'</button>';
      }).join('')+'</div>'+
      (a>=0?'<div class="exp '+(a===ci?'good':'miss')+'" role="status"><strong>'+(a===ci?T('Correct','सही उत्तर'):T('Incorrect. The correct answer is ','गलत। सही उत्तर है ')+LET[ci])+'</strong>'+(e?'<p>'+esc(e)+'</p>':'')+(FB_ON?'<a class="report" href="#/feedback/'+encodeURIComponent(q.id)+'">'+T('Report a mistake in this question','इस प्रश्न में गलती बताएँ')+'</a>':'')+'</div>':'')+
      '<div class="qnav"><button type="button" class="btn ghost" data-act="prev"'+(st.i===0?' disabled':'')+'>'+T('Previous','पिछला')+'</button>'+
      '<button type="button" class="btn" data-act="next"'+(a<0?' disabled':'')+'>'+(last?T('See result','परिणाम देखें'):T('Next','अगला'))+'</button></div></div>';
    el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
      if(st.ans[st.i]>=0)return; var k=+b.dataset.k; st.ans[st.i]=k; record(q,k); draw();
      var x=el.querySelector('.exp'); if(x&&x.scrollIntoView)x.scrollIntoView({block:'nearest'});
    }});
    el.querySelector('[data-act=prev]').onclick=function(){st.i--;draw()};
    el.querySelector('[data-act=next]').onclick=function(){if(last)result(el,list,st.ans,null,mode);else{st.i++;draw()}};
  }
  draw();
}
function mockStart(el,list,title){
  if(!list.length){el.innerHTML=noQuestions();return}
  el.innerHTML='<div class="box">'+(title?'<h3>'+esc(title)+'</h3>':'')+
   '<p>'+T(list.length+' questions. '+list.length+' minutes. Answers are shown after you submit.',list.length+' प्रश्न। '+list.length+' मिनट। उत्तर जमा करने के बाद दिखाए जाएँगे।')+'</p>'+
   '<p class="muted small">'+T('You can change answers and move between questions before submitting. The test submits itself when time runs out.','जमा करने से पहले आप उत्तर बदल सकते हैं और प्रश्नों के बीच जा सकते हैं। समय समाप्त होने पर टेस्ट अपने आप जमा हो जाएगा।')+'</p>'+
   '<button type="button" class="btn" id="go">'+T('Start test','टेस्ट शुरू करें')+'</button></div>';
  document.getElementById('go').onclick=function(){mock(el,list)};
}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
function mock(el,list){
  var st={i:0,ans:list.map(function(){return -1}),left:list.length*60,t0:Date.now()};
  function submit(){if(timer){clearInterval(timer);timer=null}
    list.forEach(function(q,k){if(st.ans[k]>=0)record(q,st.ans[k])});
    result(el,list,st.ans,Math.round((Date.now()-st.t0)/1000),'mock');el.scrollIntoView({block:'start'})}
  function tick(){st.left--;var t=document.getElementById('tm');if(t){t.textContent=fmt(Math.max(st.left,0));if(st.left<=60)t.classList.add('low')}if(st.left<=0)submit()}
  function draw(){
    var q=list[st.i],a=st.ans[st.i],o=qOpts(q),done=st.ans.filter(function(x){return x>=0}).length;
    el.innerHTML='<div class="box">'+
     '<div class="qmeta"><span class="count">'+T('Question','प्रश्न')+' '+(st.i+1)+' / '+list.length+'</span><span>'+T('Time left','शेष समय')+' <span class="timer'+(st.left<=60?' low':'')+'" id="tm">'+fmt(st.left)+'</span></span></div>'+
     '<p class="qtext">'+qHTML(q)+'</p>'+qFig(q)+
     '<div class="opts">'+o.map(function(x,k){return '<button type="button" class="opt'+(a===k?' sel':'')+'" data-k="'+k+'" aria-pressed="'+(a===k)+'"><span class="bub">'+LET[k]+'</span>'+(oFig(q,k)||'<span>'+esc(x)+'</span>')+'</button>'}).join('')+'</div>'+
     '<div class="qnav"><button type="button" class="btn ghost" data-act="prev"'+(st.i===0?' disabled':'')+'>'+T('Previous','पिछला')+'</button>'+
     (st.i<list.length-1?'<button type="button" class="btn" data-act="next">'+T('Next','अगला')+'</button>':'<button type="button" class="btn" data-act="sub">'+T('Submit test','टेस्ट जमा करें')+'</button>')+'</div>'+
     '<div class="palette" aria-label="'+T('Question palette','प्रश्न सूची')+'">'+list.map(function(_,k){return '<button type="button" data-g="'+k+'" class="'+(st.ans[k]>=0?'done':'')+(k===st.i?' cur':'')+'">'+(k+1)+'</button>'}).join('')+'</div>'+
     '<p class="small muted" style="margin-top:12px">'+T(done+' of '+list.length+' answered.',list.length+' में से '+done+' उत्तर दिए।')+' <button type="button" class="btn ghost" data-act="sub" style="min-height:36px;padding:4px 12px;font-size:14px">'+T('Submit now','अभी जमा करें')+'</button></p></div>';
    el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var k=+b.dataset.k;st.ans[st.i]=(st.ans[st.i]===k?-1:k);draw()}});
    el.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){st.i=+b.dataset.g;draw()}});
    var p=el.querySelector('[data-act=prev]');p.onclick=function(){st.i--;draw()};
    var n=el.querySelector('[data-act=next]');if(n)n.onclick=function(){st.i++;draw()};
    el.querySelectorAll('[data-act=sub]').forEach(function(b){b.onclick=function(){
      var un=list.length-st.ans.filter(function(x){return x>=0}).length;
      if(un>0&&!confirm(T(un+' questions are unanswered. Submit the test?',un+' प्रश्नों के उत्तर नहीं दिए गए। क्या टेस्ट जमा करें?')))return;
      submit();
    }});
  }
  draw(); timer=setInterval(tick,1000);
}
function result(el,list,ans,secs,mode){
  var c=0,w=0,u=0;
  list.forEach(function(q,k){if(ans[k]<0)u++;else if(ans[k]===ansIdx(q))c++;else w++});
  var pct=Math.round(c*100/list.length);
  var isSet=RKEY&&RKEY.split('/').length===4;
  if(RKEY&&RKEY.indexOf('daily')===0)markDaily(pct,RKEY.split('/')[1]);
  if(isSet){var sc=load('setscore',{});if(sc[RKEY]==null||pct>sc[RKEY]){sc[RKEY]=pct;save('setscore',sc)}}
  var nextHref='';
  if(isSet){var kp=RKEY.split('/'),nn=+kp[3]+1;if(setsOf(qsFor(kp[0],kp[1])).length>=nn)nextHref='#/t/'+kp[0]+'/'+kp[1]+'/'+kp[2]+'/'+nn}
  el.innerHTML='<div class="box"><h3>'+T('Your result','आपका परिणाम')+'</h3>'+
   '<div class="score">'+c+' / '+list.length+'</div>'+
   '<div class="stats"><span><b style="color:var(--ok)">'+c+'</b>'+T('Correct','सही')+'</span><span><b style="color:var(--rose)">'+w+'</b>'+T('Wrong','गलत')+'</span><span><b>'+u+'</b>'+T('Not answered','उत्तर नहीं दिया')+'</span><span><b>'+pct+'%</b>'+T('Score','स्कोर')+'</span>'+(secs!=null?'<span><b>'+fmt(secs)+'</b>'+T('Time taken','लगा समय')+'</span>':'')+'</div>'+
   '<p>'+(pct>=80?T('Strong work. Try a mock test or move to the next topic.','बहुत अच्छा। मॉक टेस्ट दें या अगले टॉपिक पर जाएँ।'):pct>=50?T('Good base. Revise the questions you missed and try again.','अच्छी शुरुआत। छूटे हुए प्रश्न दोहराएँ और फिर से प्रयास करें।'):T('Read the notes once more, then practise again. Every attempt builds speed.','नोट्स एक बार फिर पढ़ें, फिर दोबारा अभ्यास करें। हर प्रयास से गति बढ़ती है।'))+'</p>'+
   shareScore(c+' / '+list.length)+thought()+'<p class="small" style="margin:10px 0 0"><a href="#/feedback">⭐ '+T('Was this useful? Rate us and tell us what to improve','क्या यह उपयोगी था? हमें रेटिंग दें और बताएँ क्या सुधारें')+'</a> · '+shareLink()+'</p>'+'<div class="btns"><button type="button" class="btn'+(nextHref?' ghost':'')+'" id="again">'+T('Try again','फिर से प्रयास करें')+'</button>'+(nextHref?'<a class="btn" href="'+nextHref+'">'+T('Next set →','अगला सेट →')+'</a>':'')+'</div></div>'+
   (mode==='mock'?'<div class="review"><h3>'+T('Answer review','उत्तर समीक्षा')+'</h3>'+list.map(function(q,k){return revCard(q,k,ans[k])}).join('')+'</div>':'');
  document.getElementById('again').onclick=function(){
    var l=mode==='practice'||mode==='pyq'?list:shuffle(list);
    if(mode==='mock')mock(el,l);else runner(el,l,mode);
    window.scrollTo(0,0);
  };
}
function revCard(q,k,chosen){
  var ci=ansIdx(q),o=qOpts(q),e=qExp(q);
  var line='<div class="rev-a">'+T('Correct answer: ','सही उत्तर: ')+'<span class="c">'+LET[ci]+'. '+esc(o[ci])+'</span>'+(oFig(q,ci)?' <span class="rev-fig">'+q.options_figures[ci]+'</span>':'');
  if(chosen!=null){line+=chosen<0?' <span class="muted">('+T('not answered','उत्तर नहीं दिया')+')</span>':(chosen===ci?'':'<br><span class="w">'+T('Your answer: ','आपका उत्तर: ')+LET[chosen]+'</span>')}
  line+='</div>'+(FB_ON?'<a class="report" href="#/feedback/'+encodeURIComponent(q.id)+'">'+T('Report a mistake','गलती बताएँ')+'</a>':'');
  return '<div class="box"><div class="qmeta"><span class="count">'+(k+1)+'.</span>'+chips(q)+bmBtn(q)+'</div><p class="qtext" style="font-size:17px;margin-bottom:6px">'+qHTML(q)+'</p>'+qFig(q)+line+(e?'<p class="small muted" style="margin:6px 0 0">'+esc(e)+'</p>':'')+'</div>';
}
function revision(el,list){
  if(!list.length){el.innerHTML=noQuestions();return}
  var m=load('mist',[]),mine=list.filter(function(q){return m.indexOf(q.id)>=0}),rest=list.filter(function(q){return m.indexOf(q.id)<0});
  function card(q,k){
    var ci=ansIdx(q),o=qOpts(q),e=qExp(q);
    return '<div class="box"><div class="qmeta"><span class="count">'+(k+1)+'.</span>'+chips(q)+bmBtn(q)+'</div><p class="qtext" style="font-size:17px;margin-bottom:4px">'+qHTML(q)+'</p>'+qFig(q)+
      '<details class="rv"><summary>'+T('Show answer','उत्तर देखें')+'</summary><div class="rev-a"><span class="c">'+LET[ci]+'. '+esc(o[ci])+'</span>'+(oFig(q,ci)?' <span class="rev-fig">'+q.options_figures[ci]+'</span>':'')+'</div>'+(e?'<p class="small muted" style="margin:6px 0 0">'+esc(e)+'</p>':'')+'</details></div>';
  }
  el.innerHTML=(mine.length?'<h3>'+T('Your mistakes','आपकी गलतियाँ')+' ('+mine.length+')</h3><p class="small muted">'+T('Questions you answered wrong last time. Answer them correctly in Practice and they leave this list.','जिन प्रश्नों का पिछली बार गलत उत्तर दिया। अभ्यास में सही उत्तर देने पर ये इस सूची से हट जाएँगे।')+'</p>'+mine.map(card).join('')+'<h3 style="margin-top:22px">'+T('All questions','सभी प्रश्न')+'</h3>':
    '<p class="small muted">'+T('Try to answer in your head first, then open the answer.','पहले मन में उत्तर सोचें, फिर उत्तर खोलें।')+'</p>')+rest.map(card).join('');
}

    var subs=sel.filter(function(id){return pool.some(function(q){return q.subject===id})});

var PAPERS=window.PAPERS||[];
function isStyle(q){return q.style==='pyq'}
function paperById(id){for(var i=0;i<PAPERS.length;i++)if(PAPERS[i].id===id)return PAPERS[i];return null}
function pName(p){return T(p.name,p.name_hi||p.name)}
function pTotals(p){var q=0,m=0,t=0;p.blocks.forEach(function(b){t+=b.mins;b.sections.forEach(function(s){q+=s.q;m+=s.q*s.marks})});return {q:q,m:m,t:t}}
function negTxt(n){if(!n)return T('None','कोई नहीं');if(Math.abs(n-1/3)<1e-6)return '1/3';return String(Math.round(n*100)/100)}
var BANK_ONLY={'coded-inequality':1,'input-output':1,'number-series':1},NOT_BANK={'height-distance':1};
function pickFor(sec,used,fam){
  var keys=Object.keys(sec.from),out=[];
  keys.forEach(function(sid,k){
    var want=k===keys.length-1?sec.q-out.length:Math.round(sec.q*sec.from[sid]);
    var pool=QS.filter(function(q){return q.subject===sid&&!used[q.id]&&(fam==='banking'?!NOT_BANK[q.topic]:!BANK_ONLY[q.topic])});
    var st=shuffle(pool.filter(isStyle)),rest=shuffle(pool.filter(function(q){return !isStyle(q)}));
    var half=Math.ceil(want/2),pick=st.slice(0,half);pick=pick.concat(rest.slice(0,want-pick.length));
    if(pick.length<want)pick=pick.concat(st.slice(half,half+want-pick.length));
    pick.forEach(function(q){used[q.id]=1});out=out.concat(pick);
  });
  return shuffle(out);
}
function buildPaper(p){var used={};return p.blocks.map(function(b){return {mins:b.mins,en:b.en,hi:b.hi,secs:b.sections.map(function(s){return {def:s,list:pickFor(s,used,p.family)}})}})}

function runPaper(el,p,B){
  B.forEach(function(b){b.secs.forEach(function(s){s.ans=s.list.map(function(){return -1})})});
  var st={b:0,s:0,i:0,left:B[0].mins*60,t0:Date.now()};
  function blockDone(){
    if(st.b<B.length-1){st.b++;st.s=0;st.i=0;st.left=B[st.b].mins*60;draw();window.scrollTo(0,0)}else finish();
  }
  function finish(){if(timer){clearInterval(timer);timer=null}
    B.forEach(function(b){b.secs.forEach(function(s){s.list.forEach(function(q,k){if(s.ans[k]>=0)record(q,s.ans[k])})})});
    paperResult(el,p,B,Math.round((Date.now()-st.t0)/1000));window.scrollTo(0,0)}
  function tick(){st.left--;var t=document.getElementById('tm');if(t){t.textContent=fmt(Math.max(st.left,0));if(st.left<=60)t.classList.add('low')}
    if(st.left<=0){if(st.b<B.length-1)alert(T('Time is over for this part. Moving to the next part.','इस भाग का समय समाप्त। अगले भाग पर जा रहे हैं।'));blockDone()}}
  function draw(){
    var blk=B[st.b],sec=blk.secs[st.s],q=sec.list[st.i],a=sec.ans[st.i],o=qOpts(q),last=st.b===B.length-1;
    var bname=blk.en?T(blk.en,blk.hi):(B.length>1?T('Part ','भाग ')+(st.b+1)+' / '+B.length:'');
    var answered=0,total=0;blk.secs.forEach(function(s){total+=s.list.length;answered+=s.ans.filter(function(x){return x>=0}).length});
    el.innerHTML='<div class="box">'+
     '<div class="qmeta"><span class="count">'+(bname?esc(bname)+' · ':'')+esc(T(sec.def.en,sec.def.hi))+'</span><span>'+T('Time left','शेष समय')+' <span class="timer'+(st.left<=60?' low':'')+'" id="tm">'+fmt(st.left)+'</span></span></div>'+
     (blk.secs.length>1?'<div class="setbtns sectabs">'+blk.secs.map(function(s,k){var d=s.ans.filter(function(x){return x>=0}).length;return '<button type="button" class="setbtn'+(k===st.s?' on':'')+'" data-sec="'+k+'" style="cursor:pointer;font:inherit;text-align:left"><b>'+esc(T(s.def.en,s.def.hi))+'</b>'+d+' / '+s.list.length+'</button>'}).join('')+'</div>':'')+
     '<p class="small muted" style="margin:0 0 6px">'+T('Question','प्रश्न')+' '+(st.i+1)+' / '+sec.list.length+' · +'+(Math.round(sec.def.marks*100)/100)+(sec.def.neg?' / −'+negTxt(sec.def.neg):'')+'</p>'+
     '<p class="qtext">'+qHTML(q)+'</p>'+qFig(q)+
     '<div class="opts">'+o.map(function(x,k){return '<button type="button" class="opt'+(a===k?' sel':'')+'" data-k="'+k+'" aria-pressed="'+(a===k)+'"><span class="bub">'+LET[k]+'</span>'+(oFig(q,k)||'<span>'+esc(x)+'</span>')+'</button>'}).join('')+'</div>'+
     '<div class="qnav"><button type="button" class="btn ghost" data-act="prev"'+(st.i===0?' disabled':'')+'>'+T('Previous','पिछला')+'</button>'+
     (st.i<sec.list.length-1?'<button type="button" class="btn" data-act="next">'+T('Next','अगला')+'</button>':(st.s<blk.secs.length-1?'<button type="button" class="btn" data-act="nsec">'+T('Next section','अगला सेक्शन')+'</button>':'<button type="button" class="btn" data-act="sub">'+(last?T('Submit paper','पेपर जमा करें'):T('Submit this part','यह भाग जमा करें'))+'</button>'))+'</div>'+
     '<div class="palette">'+sec.list.map(function(_,k){return '<button type="button" data-g="'+k+'" class="'+(sec.ans[k]>=0?'done':'')+(k===st.i?' cur':'')+'">'+(k+1)+'</button>'}).join('')+'</div>'+
     '<p class="small muted" style="margin-top:12px">'+T(answered+' of '+total+' answered in this part.','इस भाग में '+total+' में से '+answered+' उत्तर दिए।')+' <button type="button" class="btn ghost" data-act="sub" style="min-height:36px;padding:4px 12px;font-size:14px">'+(last?T('Submit paper now','अभी पेपर जमा करें'):T('Submit this part now','यह भाग अभी जमा करें'))+'</button></p></div>';
    el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var k=+b.dataset.k;sec.ans[st.i]=(sec.ans[st.i]===k?-1:k);draw()}});
    el.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){st.i=+b.dataset.g;draw()}});
    el.querySelectorAll('[data-sec]').forEach(function(b){b.onclick=function(){st.s=+b.dataset.sec;st.i=0;draw()}});
    el.querySelector('[data-act=prev]').onclick=function(){st.i--;draw()};
    var n=el.querySelector('[data-act=next]');if(n)n.onclick=function(){st.i++;draw()};
    var ns=el.querySelector('[data-act=nsec]');if(ns)ns.onclick=function(){st.s++;st.i=0;draw()};
    el.querySelectorAll('[data-act=sub]').forEach(function(b){b.onclick=function(){

function r2(x){return Math.round(x*100)/100}
function paperResult(el,p,B,secs){
  var rows=[],tot={c:0,w:0,u:0,m:0,max:0};
  B.forEach(function(b){b.secs.forEach(function(s){var c=0,w=0,u=0;s.list.forEach(function(q,k){if(s.ans[k]<0)u++;else if(s.ans[k]===ansIdx(q))c++;else w++});
    var m=c*s.def.marks-w*s.def.neg,max=s.list.length*s.def.marks;rows.push({s:s,c:c,w:w,u:u,m:m,max:max});tot.c+=c;tot.w+=w;tot.u+=u;tot.m+=m;tot.max+=max})});
  var pct=Math.max(0,Math.round(tot.m*100/tot.max)),best=load('paperbest',{});if(best[p.id]==null||pct>best[p.id]){best[p.id]=pct;save('paperbest',best)}
  var weak=rows.slice().sort(function(a,b){return a.m/a.max-b.m/b.max})[0];
  el.innerHTML='<div class="box"><h3>'+T('Your result','आपका परिणाम')+' — '+esc(pName(p))+'</h3>'+
   '<div class="score">'+r2(tot.m)+' / '+Math.round(tot.max)+'</div>'+
   '<div class="stats"><span><b style="color:var(--ok)">'+tot.c+'</b>'+T('Correct','सही')+'</span><span><b style="color:var(--rose)">'+tot.w+'</b>'+T('Wrong','गलत')+'</span><span><b>'+tot.u+'</b>'+T('Not answered','उत्तर नहीं दिया')+'</span><span><b>'+pct+'%</b>'+T('Marks','अंक')+'</span><span><b>'+fmt(secs)+'</b>'+T('Time taken','लगा समय')+'</span></div>'+
   '<div class="tbl-wrap" style="padding:0"><table><thead><tr><th>'+T('Section','सेक्शन')+'</th><th class="n">'+T('Correct','सही')+'</th><th class="n">'+T('Wrong','गलत')+'</th><th class="n">'+T('Left','छोड़े')+'</th><th class="n">'+T('Marks','अंक')+'</th></tr></thead><tbody>'+
   rows.map(function(r){return '<tr><td>'+esc(T(r.s.def.en,r.s.def.hi))+'</td><td class="n">'+r.c+'</td><td class="n">'+r.w+'</td><td class="n">'+r.u+'</td><td class="n">'+r2(r.m)+' / '+Math.round(r.max)+'</td></tr>'}).join('')+'</tbody></table></div>'+
   (tot.w?'<p class="small muted" style="margin-top:10px">'+T('Marks lost to negative marking: ','नकारात्मक अंकन से कटे अंक: ')+'<b>'+r2(rows.reduce(function(a,r){return a+r.w*r.s.def.neg},0))+'</b>. '+T('Answer only when you are fairly sure.','उत्तर तभी दें जब काफ़ी भरोसा हो।')+'</p>':'')+
   (weak?'<p>'+T('Work more on: ','इस पर और मेहनत करें: ')+'<b>'+esc(T(weak.s.def.en,weak.s.def.hi))+'</b></p>':'')+
   shareScore(r2(tot.m)+' / '+Math.round(tot.max))+thought()+'<p class="small" style="margin:10px 0 0"><a href="#/feedback">⭐ '+T('Was this useful? Rate us and tell us what to improve','क्या यह उपयोगी था? हमें रेटिंग दें और बताएँ क्या सुधारें')+'</a> · '+shareLink()+'</p>'+'<div class="btns"><button type="button" class="btn" id="pnew">'+T('Start a new paper','नया पेपर शुरू करें')+'</button><a class="btn ghost" href="#/papers">'+T('All model papers','सभी मॉडल पेपर')+'</a></div></div>'+
   '<div class="review"><h3>'+T('Answer review','उत्तर समीक्षा')+'</h3>'+rows.map(function(r){var n=0;return '<details class="bank"><summary>'+esc(T(r.s.def.en,r.s.def.hi))+'<span class="muted small">'+r.c+' / '+r.s.list.length+'</span></summary><div style="padding:0 12px 12px">'+r.s.list.map(function(q,k){return revCard(q,k,r.s.ans[k])}).join('')+'</div></details>'}).join('')+'</div>';
  document.getElementById('pnew').onclick=function(){paperPage(p.id);window.scrollTo(0,0)};
}

/* ---------- daily quiz + streak ---------- */
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function seeded(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function dailyList(sid){
  var key=dayKey()+'|'+(sid||'mix'),h=0;for(var i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))|0;
  var rnd=seeded(h),subs=sid?[sid]:SUBJ.filter(function(s){return s.id!=='ca'&&s.id!=='hindi'}).map(function(s){return s.id}),n=sid?10:25,out=[],used={};
  for(var k=0;out.length<n&&k<400;k++){
    var id=subs[k%subs.length],pool=ALL.filter(function(q){return q.subject===id&&!used[q.id]});
    if(!pool.length)continue;var q=pool[Math.floor(rnd()*pool.length)];used[q.id]=1;out.push(q);
  }
  return out;
}
function streakInfo(){var st=load('streak',{last:'',n:0}),y=new Date();y.setDate(y.getDate()-1);var alive=st.last===dayKey()||st.last===dayKey(y);return {n:alive?st.n:0,done:st.last===dayKey(),best:st.best||st.n||0}}
function dailyDone(id){return load('dailydone',{})[dayKey()+'|'+(id||'mix')]!=null}
function markDaily(pct,id){
  var dd=load('dailydone',{}),k=dayKey()+'|'+(id||'mix');if(dd[k]==null||pct>dd[k]){dd[k]=pct;save('dailydone',dd)}
  var st=load('streak',{last:'',n:0,best:0}),today=dayKey(),y=new Date();y.setDate(y.getDate()-1);
  if(st.last!==today){st.n=(st.last===dayKey(y))?st.n+1:1;st.last=today;st.best=Math.max(st.best||0,st.n);save('streak',st)}
  var h=load('dailyhist',{});h[today]=pct;save('dailyhist',h);
}
